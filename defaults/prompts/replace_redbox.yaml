# Prompts do workflow 'replace_redbox' (UM quadrado vermelho). Use {request} onde o pedido do usuário entra.
# O Clef escolhe entre eles pelo campo 'when'. Escreva o 'when' dizendo QUANDO usar, como o usuário falaria.

default: substituir
presets:
- id: substituir
  name: Substituir o que está no quadrado
  when: Substituir, trocar por outra coisa ou apagar algo que JÁ ESTÁ dentro do quadrado vermelho. Há um objeto,
    pessoa ou peça ali que deve sair e dar lugar ao que o usuário descreveu.
  text: 'Replace the red square in the image with: {request}. Remove the red square completely and render the object
    exactly in its place, matching the lighting, perspective, scale and style of the surroundings. Keep everything
    outside the red square unchanged. Photorealistic, sharp, detailed.'
  rewrite: false
- id: adicionar
  name: Adicionar um objeto no quadrado
  when: Adicionar, acrescentar, colocar, inserir ou incluir um objeto NOVO no ponto marcado pelo quadrado vermelho.
    O local está vazio ou é só fundo, não há nada ali para tirar, e o resto da imagem continua igual.
  text: 'Add the following to the image, inside the red square: {request}. The red square only marks where the new
    object goes; the area is empty background, so do not remove or replace anything that is already in the scene.
    Place the new object inside the red square, at the size, position and orientation the square indicates, and remove
    the red square completely. Match the lighting, perspective, scale, shadows, reflections and style of the
    surroundings, with natural contact shadows where it touches a surface. Keep everything outside the red square
    unchanged. Photorealistic, sharp, detailed.'
  rewrite: false
